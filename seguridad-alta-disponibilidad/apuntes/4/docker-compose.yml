services:
  router:
    image: ubuntu:24.04
    container_name: router
    cap_add:
      - NET_ADMIN
    sysctls:
      net.ipv4.ip_forward: "1"
    networks:
      wan:
        interface_name: eth0
        ipv4_address: 172.30.0.2
      lan:
        interface_name: eth1
        ipv4_address: 192.168.50.2
    command: >
      bash -c "apt-get update &&
               apt-get install -y iptables &&
               sleep infinity"

networks:
  wan:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24

  lan:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 192.168.50.0/24
