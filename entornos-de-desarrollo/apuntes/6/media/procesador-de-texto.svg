@startuml

class Documento {
  - parrafos: List<Parrafo>
}
abstract class Parrafo {
  - alineacion: Alineacion
}

class ParrafoTexto {
  - cadenas: List<Cadena>
}

class ParrafoImagen {
  - imagen: Imagen
}

class Cadena {
  - contenido: String
}

class Formato{
  - negrita: boolean
  - cursiva: boolean
  - subrayado: boolean
  - fuente: String
  - tamano: int
}

class Imagen{
}

enum Alineacion {
  izquierda
  derecha
  centrada
}

Alineacion "1" - - "0..*" Parrafo

Documento "1" *- - "0..*" Parrafo
Parrafo <|- - ParrafoTexto
Parrafo <|- - ParrafoImagen

ParrafoTexto  *- - Cadena

Formato "0..1" - - "*" Cadena

Formato "1" - - "*" Documento

ParrafoImagen "0..*" - - "1" Imagen
@enduml

