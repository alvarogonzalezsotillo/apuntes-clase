@startuml
left to right direction

actor Usuario
actor Administrador
actor Escritor
Escritor - -|> Usuario
Administrador - -|> Escritor

rectangle Foro {
    Usuario - - (Registrarse)
    (Registrarse) <- - (Validar con SMS) : <<extends>>
    (Registrarse) <- - (Validar con email) : <<extends>>

    Usuario - - (Responder hilo)
    Escritor  - - (Crear hilo)

    Administrador  - - (Gestionar usuarios)

    (Banear usuario) - -> (Gestionar usuarios) : <<extends>>
    (Promover a escritor) - -> (Gestionar usuarios) : <<extends>>
    (Consultar datos) - -> (Gestionar usuarios) : <<extends>>
    (Aceptar registro) - -> (Gestionar usuarios) : <<extends>>

    (Banear usuario) - -> (Consultar datos) : <<includes>>    
    (Aceptar registro) - -> (Consultar datos) : <<includes>>    
    (Promover a escritor) - -> (Consultar datos) : <<includes>>    

    Usuario  - - (Reportar usuario)                
}



@enduml  

