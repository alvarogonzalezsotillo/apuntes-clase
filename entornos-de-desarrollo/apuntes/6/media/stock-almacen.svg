" y="321.1">1</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="20" x="136.5448" y="362.076">1..*</text><!--link Entrada to LineaEntrada--><path d="M455.27,303.14 C435.55,330.87 411.57,364.59 394.51,388.58 " fill="none" id="Entrada-LineaEntrada" style="stroke: #A80036; stroke-width: 1.0;"/><polygon fill="#A80036" points="462.55,292.9,455.8145,295.4755,455.6014,302.6835,462.3368,300.108,462.55,292.9" style="stroke: #A80036; stroke-width: 1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="7" x="451.3668" y="313.5039">1</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="20" x="376.9871" y="377.2068">1..*</text><!--
@startuml

class Producto {
  - nombre : String
  - stock : int
  + getStock() : int
  + aumentarStock(cantidad : int)
  + disminuirStock(cantidad : int)
}

class Venta {
  - fecha : Date
  - lineas : List<LineaVenta>
  + getImporte() : double
}

class LineaVenta {
  - cantidad : int
  - precio : double
  + getSubtotal() : double
}

class Entrada {
  - fecha : Date
  - lineas : List<LineaEntrada>
}

class LineaEntrada {
  - cantidad : int
}

class Almacen {
  - cantidad : int
  + getStock(Producto): int
  + validaVenta(Venta): Boolean
  + ajustaStockVenta(Venta)
  + ajustaStockEntrada(Entrada)
}

Almacen "1" o- - "0..*" Producto



Producto "1" - - "0..*" LineaVenta
Producto "1" - - "0..*" LineaEntrada

Venta "1" *- - "1..*" LineaVenta
Entrada "1" *- - "1..*" LineaEntrada



@enduml

