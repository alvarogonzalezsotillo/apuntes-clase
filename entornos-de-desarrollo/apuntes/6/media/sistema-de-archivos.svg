"spacingAndGlyphs" textLength="7" x="196.8706" y="198.1106">1</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="20" x="163.062" y="153.0364">0..*</text><!--
@startuml

abstract class Nodo {
  - nombre : String
  - permisos : String
  + renombrar(nuevoNombre : String)
  + copiar() : Nodo
  + borrar()
}

class Fichero {
  - contenido : String
}

class Carpeta {
  - hijos : List<Nodo>
  + agregar(n : Nodo)
  + eliminar(n : Nodo)
}

Nodo <|- - Fichero
Nodo <|- - Carpeta

Carpeta "1" *- - "0..*" Nodo : contiene

@enduml  

