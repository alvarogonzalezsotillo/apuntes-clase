olygon fill="#A80036" points="456.03,126.75,447.9607,121.1032,451.1222,125.7941,446.4313,128.9556,456.03,126.75" style="stroke: #A80036; stroke-width: 1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="62" x="344.87" y="101.707">«extends»</text><!--link Reponer productos to Cerrar máquina--><path d="M278.86,272.83 C299.11,278.26 322.48,284.24 343.87,289 C381,297.27 422.77,305.01 456.75,310.91 " fill="none" id="Reponer productos-Cerrar máquina" style="stroke: #A80036; stroke-width: 1.0;"/><polygon fill="#A80036" points="461.51,311.74,453.3285,306.2571,456.5839,310.8833,451.9577,314.1388,461.51,311.74" style="stroke: #A80036; stroke-width: 1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="57" x="347.37" y="284.897">«include»</text><!--
@startuml
left to right direction

actor Empleado

rectangle "Máquina Expendedora" {



  Empleado - - (Reponer productos)
  Empleado - - (Cambiar precios)

  (Reponer productos) - -> (Abrir máquina) : <<include>>
  (Reponer productos) - -> (Actualizar inventario) : <<include>>
  (Dar de alta producto) - -> (Actualizar inventario) : <<extends>>
  (Dar de baja producto) - -> (Actualizar inventario) : <<extends>>
  (Reponer productos) - -> (Cerrar máquina) : <<include>>
}

@enduml    

