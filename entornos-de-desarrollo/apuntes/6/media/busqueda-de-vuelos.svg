@startuml
start

repeat
  :Buscar vuelo (origen y destino);

  

  fork
    :Consultar Proveedor 1;
  fork again
    :Consultar Proveedor 2;
  fork again
    :Consultar Mayorista 1;
  fork again
    :Consultar Mayorista 2;
  end fork

  :Contactar con el cliente\npara comunicar ofertas;

  repeat
    if (¿Cliente elige oferta?) then (Sí)
      :Contactar con proveedor\npara reservar vuelo;

      if (¿Oferta disponible?) then (Sí)
        :Confirmar reserva;
        stop
      else (No)
- - -        :Informar indisponibilidad;
      endif
    else (No)
      :Fin sin reserva;
      stop
    endif
  repeat while (¿Elegir otra oferta?) is (Sí)

repeat while (¿Reiniciar búsqueda?) is (Sí)
stop

@enduml

