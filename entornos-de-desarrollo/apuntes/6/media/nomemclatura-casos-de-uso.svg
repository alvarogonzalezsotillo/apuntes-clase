@startuml
left to right direction

actor Usuario

rectangle "Sistema" {

usecase "Caso de uso" as UC1
usecase "Caso de uso extendido" as UC2
usecase "Caso de uso incluido"  as UC3     

}

Usuario - -> UC1
UC2 - -> UC1 : <<extend>>
UC1 - -> UC3 : <<include>>

@enduml

