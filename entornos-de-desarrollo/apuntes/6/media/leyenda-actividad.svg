@startuml

start

repeat
:Acción inicial;

if (¿Decisión?) then (Sí)
:Acción rama Sí;
else (No)
:Acción rama No;
endif

fork
:Acción paralela 1;
fork again
:Acción paralela 2;
end fork

:Acción;

repeat while (¿Decisión?) is (Si)
->No;

stop


@enduml

