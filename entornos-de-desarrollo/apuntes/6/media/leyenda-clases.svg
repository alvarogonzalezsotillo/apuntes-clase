@startuml

interface Vehiculo {
  +mover()
}

class Coche {
  +matricula: String
  -atributoPrivado: Int
  #metodoProtegido()
  +mover()
}

class Motor
class Rueda
class Persona

Vehiculo <|- - Coche

Coche *- - Motor : composición

Coche *- - Rueda : composición

Coche o- - Viajes : Agregación


Persona "1" - - "0..*" Coche : posee


@enduml

