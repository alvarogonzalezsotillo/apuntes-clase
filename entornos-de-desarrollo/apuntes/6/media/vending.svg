.5,263.64 M147.5,282.64 L134.5,297.64 M147.5,282.64 L160.5,297.64 " fill="none" filter="url(#f1sxp2ppqckxwr)" style="stroke: #A80036; stroke-width: 2.0;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacingAndGlyphs" textLength="67" x="114" y="319.6059">Empleado</text><!--link Cliente to Empleado--><path d="M74.92,280.67 C87.75,280.67 101.52,280.67 113.53,280.67 " fill="none" id="Cliente-Empleado" style="stroke: #A80036; stroke-width: 1.0;"/><polygon fill="none" points="74.93,287.67,54.93,280.67,74.93,273.67,74.93,287.67" style="stroke: #A80036; stroke-width: 1.0;"/><!--link Cliente to Comprar producto--><path d="M53.48,304.48 C86.65,336.91 151.51,393.37 220,414.67 C321.81,446.34 356.79,441.79 459.9,414.67 C529.28,396.43 599.91,347.75 635.15,320.97 " fill="none" id="Cliente-Comprar producto" style="stroke: #A80036; stroke-width: 1.0;"/><!--link Cliente to Consultar precio--><path d="M53.43,254.04 C86.53,217.26 151.32,151.33 220,114.67 C241.38,103.26 266.76,95.36 289.45,90 " fill="none" id="Cliente-Consultar precio" style="stroke: #A80036; stroke-width: 1.0;"/><!--link Pagar con tarjeta de crédito to Comprar producto--><path d="M460.11,302.67 C496.49,302.67 536.65,302.67 571.25,302.67 " fill="none" id="Pagar con tarjeta de crédito-Comprar producto" style="stroke: #A80036; stroke-width: 1.0;"/><polygon fill="#A80036" points="576.12,302.67,567.12,298.67,571.12,302.67,567.12,306.67,576.12,302.67" style="stroke: #A80036; stroke-width: 1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="56" x="490.9" y="298.567">«extend»</text><!--link Pagar con monedas to Comprar producto--><path d="M409.63,239.16 C462.99,252.8 542.66,273.16 597.32,287.13 " fill="none" id="Pagar con monedas-Comprar producto" style="stroke: #A80036; stroke-width: 1.0;"/><polygon fill="#A80036" points="602.06,288.34,594.3368,282.2283,597.2169,287.0971,592.3482,289.9772,602.06,288.34" style="stroke: #A80036; stroke-width: 1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="56" x="490.9" y="257.227">«extend»</text><!--link Comprar producto to Entregar producto--><path d="M740.55,302.67 C775.76,302.67 817.13,302.67 853,302.67 " fill="none" id="Comprar producto-Entregar producto" style="stroke: #A80036; stroke-width: 1.0;"/><polygon fill="#A80036" points="857.65,302.67,848.65,298.67,852.65,302.67,848.65,306.67,857.65,302.67" style="stroke: #A80036; stroke-width: 1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="57" x="771.32" y="298.567">«include»</text><!--link Empleado to Reponer productos--><path d="M172.95,237.58 C185.02,219.79 201.07,200.4 220,187.67 C238.2,175.44 260.46,167.34 281.42,161.99 " fill="none" id="Empleado-Reponer productos" style="stroke: #A80036; stroke-width: 1.0;"/><!--link Empleado to Cambiar precios--><path d="M181.36,315.22 C192.76,325.6 206.17,336.2 220,343.67 C241.68,355.38 267.48,363.53 290.42,369.07 " fill="none" id="Empleado-Cambiar precios" style="stroke: #A80036; stroke-width: 1.0;"/><!--
@startuml
left to right direction

actor Cliente
actor Empleado

Cliente <|-down- Empleado

rectangle "Máquina Expendedora" {

  Cliente - - (Comprar producto)
  Cliente - - (Consultar precio)

  (Pagar con tarjeta de crédito) - -> (Comprar producto) : <<extend>>
  (Pagar con monedas) - -> (Comprar producto)  : <<extend>>
  (Comprar producto) - -> (Entregar producto) : <<include>>

  Empleado - - (Reponer productos)
  Empleado - - (Cambiar precios)
}

@enduml    

