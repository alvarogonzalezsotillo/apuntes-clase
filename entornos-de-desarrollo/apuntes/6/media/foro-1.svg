inistrador to Banear usuario--><path d="M103.1,404.06 C182.91,424.27 342.92,464.8 424.18,485.38 " fill="none" id="Administrador-Banear usuario" style="stroke: #A80036; stroke-width: 1.0;"/><!--link Usuario to Reportar usuario--><path d="M328.23,173.38 C353.78,180.85 393.94,192.59 425.64,201.86 " fill="none" id="Usuario-Reportar usuario" style="stroke: #A80036; stroke-width: 1.0;"/><!--
@startuml
left to right direction

actor Usuario
actor Administrador
actor Escritor
Escritor - -|> Usuario
Administrador - -|> Escritor

rectangle Foro {
    Usuario - - (Registrarse)
    (Registrarse) <- - (Validar con SMS) : <<extends>>
    (Registrarse) <- - (Validar con email) : <<extends>>

    Administrador - - (Promover a escritor)    

    Usuario - - (Responder hilo)
    Escritor  - - (Crear hilo)

    Administrador  - - (Aceptar registro)
        
    Administrador  - - (Banear usuario)

    Usuario  - - (Reportar usuario)                
}



@enduml  

