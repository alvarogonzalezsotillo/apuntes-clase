A80036; stroke-width: 1.0;"/><!--
@startuml
start

:Recibir orden de salida;

:Separar en productos refrigerados y no refrigerados;

fork
  :Localizar productos refrigerados;
  if (¿Falta algún producto?) then (Sí)
    :Crear orden de reposición;
    :Esperar llegada del producto;
  endif
  :Empaquetar productos refrigerados;
fork again
  :Localizar productos no refrigerados;
  if (¿Falta algún producto?) then (Sí)
    :Crear orden de reposición;
    :Esperar llegada del producto;
  endif
  :Empaquetar productos no refrigerados;
end fork

:Sacar productos del almacén;

stop
@enduml  

