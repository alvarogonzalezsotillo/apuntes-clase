Curso "1" *- - "1..*" Asignatura : compone

Curso "1" <- - "0..*" Alumno : pertenece

Profesor "1" - - "0..*" Asignatura : imparte

Alumno "1" - - "1" Matricula
Matricula "1" *- - "1..*" Asignatura : incluye

Matricula "1" *- - "0..*" Nota
Nota "1" - -> "1" Asignatura

@enduml

