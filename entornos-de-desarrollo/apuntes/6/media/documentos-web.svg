@startuml
left to right direction

actor Usuario
actor Gestor
actor Administrador

Gestor - -|> Usuario
Administrador - -|> Gestor


rectangle Sistema {


        
  Usuario - - (Registrarse)
  Usuario - - (Crear documento)
  Usuario - - (Modificar sus documentos)
  Usuario - - (Ver documentos de otros)

  Gestor - - (Modificar documentos de otros)

  Administrador - - (Dar de baja usuario)
  Administrador - - (Modificar datos de usuario)
  Administrador - - (Borrar documentos)

  (Modificar documentos de otros) .> (Ver documentos de otros) : <<include>>
  (Sugerir cambios) .> (Modificar documentos de otros) : <<extend>>
  (Borrar documentos) .> (Modificar documentos de otros) : <<include>>
}


@enduml  

