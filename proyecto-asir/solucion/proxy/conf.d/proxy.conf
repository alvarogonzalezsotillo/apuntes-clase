
# WordPress a traves del proxy
# El path publico /wp/ se sirve tal cual (sin reescribir a /wordpress/):
# WordPress esta canonizado como http://www.asir.test/wp y Apache lo
# sirve desde el symlink wp -> wordpress, asi no hay redireccion canonica.
server {
    listen 80;
    server_name www.asir.test;

    location = /wp {
        return 301 /wp/;
    }

    location /wp/ {
        proxy_pass http://apache:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_redirect off;
    }

    location /pma/ {
        proxy_pass http://phpmyadmin:80/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

}

